<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ONE BALANCE OFFICIAL SPONSORS</title>
<meta name="theme-color" content="#DB444C">
<link rel="icon" href="icon.png?v=20261008">
<link rel="apple-touch-icon" href="icon.png?v=20261008">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;800&display=swap">
<style>
  :root{ --main:#DB444C; --sub:#111111; --bg:#F5F5F5; --font:'Helvetica Neue', Helvetica, Arial, 'Noto Sans JP', sans-serif; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ background:var(--bg); color:var(--sub); font-family:var(--font); -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; overflow-x:hidden; }
  body{ min-height:100vh; }
  .bar{ background:var(--main); color:#fff; padding:14px 16px; text-align:center; font-weight:800; font-size:15px; letter-spacing:.06em; }
  .wrap{ max-width:720px; margin:0 auto; padding:20px 16px 40px; }
  .card{ background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.08); overflow:hidden; }
  .logo{ aspect-ratio:2/1; display:flex; align-items:center; justify-content:center; padding:18px; border-bottom:1px solid #eee; background:#fff; }
  .logo img{ max-width:100%; max-height:100%; object-fit:contain; }
  .body{ padding:20px 18px 22px; }
  .rank{ display:inline-block; font-size:11px; font-weight:800; letter-spacing:.12em; color:#fff; background:var(--main); padding:3px 10px; border-radius:20px; }
  .name{ font-size:24px; font-weight:800; margin:10px 0 4px; line-height:1.3; }
  .ind{ color:var(--main); font-weight:800; font-size:15px; }
  .msg{ margin-top:14px; font-size:17px; font-weight:800; line-height:1.6; }
  .intro{ margin-top:12px; font-size:14px; line-height:1.8; white-space:pre-wrap; color:#444; }
  .btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
  .btn{ display:flex; align-items:center; justify-content:center; height:52px; border-radius:12px; font-weight:800; font-size:15px; text-decoration:none; color:#fff; background:var(--main); }
  .btn.sub{ background:#fff; color:var(--main); border:2px solid var(--main); }
  .btn.wide{ grid-column:1/-1; }
  .back{ display:block; text-align:center; margin-top:22px; color:var(--main); font-weight:800; text-decoration:none; font-size:14px; }
  .join{ display:block; margin-top:26px; text-align:center; background:var(--main); color:#fff; text-decoration:none; font-weight:800; padding:16px; border-radius:12px; }
  .foot{ text-align:center; font-size:12px; color:#888; margin-top:26px; line-height:1.7; }
  .lead{ text-align:center; font-weight:800; font-size:16px; line-height:1.7; white-space:pre-line; }
  h2{ text-align:center; color:var(--main); font-size:18px; letter-spacing:.12em; margin:26px 0 12px; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid a{ background:#fff; border-radius:12px; box-shadow:0 1px 6px rgba(0,0,0,.08); text-decoration:none; color:var(--sub); overflow:hidden; }
  .grid .lg{ aspect-ratio:2/1; display:flex; align-items:center; justify-content:center; padding:10px; border-bottom:1px solid #f0f0f0; background:#fff; }
  .grid .lg img{ max-width:100%; max-height:100%; object-fit:contain; }
  .grid .tx{ padding:8px 10px 10px; }
  .grid .n{ font-size:13px; font-weight:800; line-height:1.35; }
  .grid .i{ font-size:11px; color:var(--main); font-weight:800; margin-top:2px; }
  .load{ text-align:center; padding:80px 0; color:#999; font-weight:800; }
  .spin{ width:36px; height:36px; border:4px solid #ddd; border-top-color:var(--main); border-radius:50%; margin:0 auto 14px; animation:r 1s linear infinite; }
  @keyframes r{ to{ transform:rotate(360deg); } }
  @media (min-width:700px){ .grid{ grid-template-columns:1fr 1fr 1fr; } .name{ font-size:28px; } }
</style>
</head>
<body>
<div class="bar">ONE BALANCE OFFICIAL SPONSORS</div>
<div class="wrap" id="app"><div class="load"><div class="spin"></div>読み込み中…</div></div>
<script>
/* ===== 設定（GASのURL） ===== */
const API = 'https://script.google.com/macros/s/AKfycbwhKWO7XGhzKJpIE_CbdDLjcS9DsYYh5tHetEfhluXEzZ1oXklnBvw3_cbNiTJJWi_Kjw/exec';
const VER = '20261008';
/* ============================ */
(function(){
  const qs = new URLSearchParams(location.search);
  const id = (qs.get('id') || 'ALL').toUpperCase();
  const from = qs.get('from') || '';
  const app = document.getElementById('app');
  const here = location.origin + location.pathname;
  const esc = s => String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const logo = c => `<img src="logos/${encodeURIComponent(c.id)}.jpg?v=${VER}" alt="${esc(c.name)}" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:this.alt}))">`;

  window.logBtn = function(cid, kind){
    const u = `${API}?api=log&id=${encodeURIComponent(cid)}&kind=${encodeURIComponent(kind)}&t=${Date.now()}`;
    try { fetch(u, { mode:'no-cors', keepalive:true }); } catch(e) { new Image().src = u; }
  };

  fetch(`${API}?id=${encodeURIComponent(id)}&from=${encodeURIComponent(from)}&t=${Date.now()}`, { cache:'no-store' })
    .then(r => r.json())
    .then(({ config:C, data:D }) => render(C, D))
    .catch(() => { app.innerHTML = '<div class="load">読み込めませんでした。<br>時間をおいてもう一度開いてください。</div>'; });

  function render(C, D){
    const join = C.JOIN_URL ? `<a class="join" href="${esc(C.JOIN_URL)}" target="_blank" rel="noopener" onclick="logBtn('ALL','募集案内')">${esc(C.JOIN_TEXT)}</a>` : '';
    const foot = `<div class="foot">${esc(C.FOOTER)}</div>`;
    if (D.mode === 'company') {
      const c = D.company, b = [];
      document.title = c.name + '｜' + C.SITE_NAME;
      if (c.hp)    b.push(`<a class="btn" href="${esc(c.hp)}" target="_blank" rel="noopener" onclick="logBtn('${c.id}','HP')">ホームページ</a>`);
      if (c.insta) b.push(`<a class="btn" href="${esc(c.insta)}" target="_blank" rel="noopener" onclick="logBtn('${c.id}','Instagram')">Instagram</a>`);
      if (c.map) {
        const m = /^https?:/.test(c.map) ? c.map : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.map);
        b.push(`<a class="btn sub" href="${esc(m)}" target="_blank" rel="noopener" onclick="logBtn('${c.id}','地図')">地図を見る</a>`);
      }
      if (c.tel) b.push(`<a class="btn sub" href="tel:${esc(c.tel.replace(/[^0-9+]/g,''))}" onclick="logBtn('${c.id}','電話')">電話する</a>`);
      if (b.length % 2 === 1) b[b.length-1] = b[b.length-1].replace('class="btn', 'class="btn wide');
      app.innerHTML = `
        <div class="card">
          <div class="logo">${logo(c)}</div>
          <div class="body">
            ${c.rank ? `<span class="rank">${esc(c.rank)}</span>` : ''}
            <div class="name">${esc(c.name)}</div>
            ${c.industry ? `<div class="ind">${esc(c.industry)}</div>` : ''}
            ${(c.msg1||c.msg2) ? `<div class="msg">${esc(c.msg1)}${c.msg2 ? '<br>' + esc(c.msg2) : ''}</div>` : ''}
            ${c.intro ? `<div class="intro">${esc(c.intro)}</div>` : ''}
            ${b.length ? `<div class="btns">${b.join('')}</div>` : ''}
          </div>
        </div>
        <a class="back" href="${here}?id=ALL&from=list">▶ ほかの企業も見る</a>
        ${join}${foot}`;
    } else if (D.mode === 'list') {
      const groups = {};
      D.list.forEach(c => { const k = c.rank || 'その他'; (groups[k] = groups[k] || []).push(c); });
      const order = C.RANK_ORDER.concat(Object.keys(groups).filter(k => C.RANK_ORDER.indexOf(k) < 0));
      let h = `<div class="lead">${esc(C.LIST_LEAD)}</div>`;
      order.forEach(k => {
        if (!groups[k]) return;
        h += `<h2>${esc(k)}</h2><div class="grid">` + groups[k].map(c => `
          <a href="${here}?id=${encodeURIComponent(c.id)}&from=list">
            <div class="lg">${logo(c)}</div>
            <div class="tx"><div class="n">${esc(c.name)}</div>${c.industry ? `<div class="i">${esc(c.industry)}</div>` : ''}</div>
          </a>`).join('') + `</div>`;
      });
      app.innerHTML = h + join + foot;
    } else {
      app.innerHTML = `<div class="card"><div class="body" style="text-align:center"><div class="name">ページが見つかりません</div></div></div>
        <a class="back" href="${here}?id=ALL">▶ 一覧を見る</a>${foot}`;
    }
  }
})();
</script>
</body>
</html>
